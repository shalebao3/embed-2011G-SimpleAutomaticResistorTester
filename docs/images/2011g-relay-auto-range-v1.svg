<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill:#172033; }
    .title { font-size:34px; font-weight:700; }
    .sub { font-size:18px; fill:#475569; }
    .h { font-size:22px; font-weight:700; }
    .t { font-size:17px; }
    .s { font-size:15px; fill:#475569; }
    .note { font-size:16px; fill:#7c2d12; }
    .box { fill:#fff; stroke:#94a3b8; stroke-width:2; rx:14; }
    .mcu { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
    .driver { fill:#fff7ed; stroke:#ea580c; stroke-width:2; }
    .measure { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; }
    .warn { fill:#fff7ed; stroke:#f97316; stroke-width:2; }
    .wire { stroke:#1f2937; stroke-width:3; fill:none; }
    .ctrl { stroke:#2563eb; stroke-width:3; fill:none; stroke-dasharray:9 7; }
    .power { stroke:#dc2626; stroke-width:3; fill:none; }
    .gnd { stroke:#111827; stroke-width:2; fill:none; }
    .node { fill:#111827; }
    .contact { stroke:#111827; stroke-width:3; fill:none; }
  </style>

  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="750" y="52" text-anchor="middle" class="title">2011G 简易自动电阻测试仪｜V1 继电器自动量程概念原理图</text>
  <text x="750" y="84" text-anchor="middle" class="sub">STM32F103C8T6 + ADC + GPIO + 三路继电器 + 暂定参考电阻 33Ω / 330Ω / 3.3kΩ</text>

  <!-- MCU -->
  <rect x="55" y="135" width="320" height="360" class="mcu" rx="16"/>
  <text x="215" y="175" text-anchor="middle" class="h">STM32F103C8T6</text>

  <text x="82" y="230" class="t">PA0 / ADC1_IN0</text>
  <line x1="245" y1="224" x2="375" y2="224" class="wire"/>

  <text x="82" y="290" class="t">PB0（候选）</text>
  <line x1="220" y1="284" x2="375" y2="284" class="ctrl"/>

  <text x="82" y="345" class="t">PB1（候选）</text>
  <line x1="220" y1="339" x2="375" y2="339" class="ctrl"/>

  <text x="82" y="400" class="t">PB10（候选）</text>
  <line x1="230" y1="394" x2="375" y2="394" class="ctrl"/>

  <text x="82" y="455" class="s">GPIO 只负责控制驱动管，</text>
  <text x="82" y="478" class="s">不能直接给继电器线圈供电。</text>

  <!-- Driver section -->
  <rect x="415" y="135" width="390" height="360" class="driver" rx="16"/>
  <text x="610" y="175" text-anchor="middle" class="h">三路继电器驱动（每路相同）</text>

  <!-- driver rows -->
  <text x="445" y="230" class="t">PB0</text>
  <rect x="495" y="210" width="55" height="30" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="522" y="231" text-anchor="middle" class="s">4.7k</text>
  <line x1="445" y1="224" x2="495" y2="224" class="ctrl"/>
  <line x1="550" y1="224" x2="585" y2="224" class="ctrl"/>
  <circle cx="610" cy="224" r="22" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="610" y="229" text-anchor="middle" class="s">Q1</text>
  <line x1="632" y1="224" x2="670" y2="224" class="wire"/>
  <rect x="670" y="198" width="75" height="52" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="708" y="220" text-anchor="middle" class="s">K1</text>
  <text x="708" y="240" text-anchor="middle" class="s">5V Coil</text>

  <text x="445" y="305" class="t">PB1</text>
  <rect x="495" y="285" width="55" height="30" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="522" y="306" text-anchor="middle" class="s">4.7k</text>
  <line x1="445" y1="299" x2="495" y2="299" class="ctrl"/>
  <line x1="550" y1="299" x2="585" y2="299" class="ctrl"/>
  <circle cx="610" cy="299" r="22" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="610" y="304" text-anchor="middle" class="s">Q2</text>
  <line x1="632" y1="299" x2="670" y2="299" class="wire"/>
  <rect x="670" y="273" width="75" height="52" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="708" y="295" text-anchor="middle" class="s">K2</text>
  <text x="708" y="315" text-anchor="middle" class="s">5V Coil</text>

  <text x="445" y="380" class="t">PB10</text>
  <rect x="495" y="360" width="55" height="30" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="522" y="381" text-anchor="middle" class="s">4.7k</text>
  <line x1="445" y1="374" x2="495" y2="374" class="ctrl"/>
  <line x1="550" y1="374" x2="585" y2="374" class="ctrl"/>
  <circle cx="610" cy="374" r="22" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="610" y="379" text-anchor="middle" class="s">Q3</text>
  <line x1="632" y1="374" x2="670" y2="374" class="wire"/>
  <rect x="670" y="348" width="75" height="52" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="708" y="370" text-anchor="middle" class="s">K3</text>
  <text x="708" y="390" text-anchor="middle" class="s">5V Coil</text>

  <text x="445" y="435" class="s">Q1~Q3：NPN（如 S8050/2N3904）或逻辑级 NMOS</text>
  <text x="445" y="460" class="s">每个线圈两端并联续流二极管（如 1N4007），方向反向于正常供电。</text>

  <!-- Range switching -->
  <rect x="845" y="135" width="600" height="510" class="measure" rx="16"/>
  <text x="1145" y="175" text-anchor="middle" class="h">参考电阻切换 + ADC 测量网络</text>

  <!-- 3.3V bus -->
  <text x="900" y="215" class="t" fill="#b91c1c">3.3V 测量激励</text>
  <line x1="1010" y1="209" x2="1380" y2="209" class="power"/>

  <!-- Branch 1 -->
  <line x1="1040" y1="209" x2="1040" y2="258" class="wire"/>
  <line x1="1018" y1="258" x2="1038" y2="258" class="contact"/>
  <line x1="1045" y1="266" x2="1072" y2="247" class="contact"/>
  <text x="1037" y="292" text-anchor="middle" class="s">K1触点</text>
  <rect x="1010" y="315" width="60" height="42" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="1040" y="342" text-anchor="middle" class="t">33Ω</text>
  <line x1="1040" y1="272" x2="1040" y2="315" class="wire"/>
  <line x1="1040" y1="357" x2="1040" y2="455" class="wire"/>

  <!-- Branch 2 -->
  <line x1="1160" y1="209" x2="1160" y2="258" class="wire"/>
  <line x1="1138" y1="258" x2="1158" y2="258" class="contact"/>
  <line x1="1165" y1="266" x2="1192" y2="247" class="contact"/>
  <text x="1157" y="292" text-anchor="middle" class="s">K2触点</text>
  <rect x="1125" y="315" width="70" height="42" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="1160" y="342" text-anchor="middle" class="t">330Ω</text>
  <line x1="1160" y1="272" x2="1160" y2="315" class="wire"/>
  <line x1="1160" y1="357" x2="1160" y2="455" class="wire"/>

  <!-- Branch 3 -->
  <line x1="1290" y1="209" x2="1290" y2="258" class="wire"/>
  <line x1="1268" y1="258" x2="1288" y2="258" class="contact"/>
  <line x1="1295" y1="266" x2="1322" y2="247" class="contact"/>
  <text x="1287" y="292" text-anchor="middle" class="s">K3触点</text>
  <rect x="1250" y="315" width="80" height="42" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="1290" y="342" text-anchor="middle" class="t">3.3kΩ</text>
  <line x1="1290" y1="272" x2="1290" y2="315" class="wire"/>
  <line x1="1290" y1="357" x2="1290" y2="455" class="wire"/>

  <!-- ADC node -->
  <line x1="980" y1="455" x2="1370" y2="455" class="wire"/>
  <circle cx="1145" cy="455" r="6" class="node"/>
  <text x="1160" y="440" class="t">Vmeas / ADC 节点</text>
  <line x1="845" y1="455" x2="980" y2="455" class="wire"/>
  <text x="868" y="442" class="s">→ PA0 / ADC1_IN0</text>

  <!-- Rx -->
  <line x1="1145" y1="455" x2="1145" y2="505" class="wire"/>
  <rect x="1100" y="505" width="90" height="48" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="1145" y="536" text-anchor="middle" class="t">Rx 待测</text>
  <line x1="1145" y1="553" x2="1145" y2="585" class="wire"/>
  <line x1="1118" y1="585" x2="1172" y2="585" class="gnd"/>
  <line x1="1127" y1="595" x2="1163" y2="595" class="gnd"/>
  <line x1="1137" y1="605" x2="1153" y2="605" class="gnd"/>
  <text x="1180" y="600" class="s">GND</text>

  <text x="875" y="625" class="note">约束：软件任何时刻只允许 K1/K2/K3 中一路吸合，换档后等待触点与测量节点稳定再 ADC。</text>

  <!-- Formula and sequence -->
  <rect x="55" y="535" width="750" height="375" class="box"/>
  <text x="85" y="580" class="h">测量关系与软件闭环</text>
  <text x="85" y="625" class="t">分压模型：</text>
  <text x="205" y="625" class="t">Vmeas = 3.3V × Rx / (Rref + Rx)</text>
  <text x="85" y="670" class="t">同源比率测量：</text>
  <text x="245" y="670" class="t">Rx = Rref × ADC / (4095 − ADC)</text>

  <text x="85" y="725" class="t">自动量程流程：</text>
  <text x="220" y="725" class="t">选择 Rref → 等待稳定 → ADC → 判断阈值 → 必要时换档 → 重测 → 计算 Rx</text>

  <text x="85" y="775" class="t">GPIO：执行换档</text>
  <text x="300" y="775" class="t">ADC：采样电压</text>
  <text x="500" y="775" class="t">CPU：判断档位并计算阻值</text>

  <text x="85" y="830" class="s">33Ω / 330Ω / 3.3kΩ 为当前理论初选值，不是最终 BOM。</text>
  <text x="85" y="860" class="s">正式定值前需完成：量程边界、ADC误差、参考电阻精度、继电器触点、线阻和校准的误差预算。</text>

  <!-- Warnings -->
  <rect x="845" y="685" width="600" height="225" class="warn" rx="16"/>
  <text x="875" y="728" class="h">V1 设计注意事项</text>
  <text x="875" y="770" class="t">① 33Ω 档需单独核算测量电流与参考电阻功耗。</text>
  <text x="875" y="805" class="t">② 低阻档重点关注：触点电阻、测试线、电阻精度。</text>
  <text x="875" y="840" class="t">③ 10MΩ 高阻档尚未纳入本图，后续单独设计漏电/缓冲方案。</text>
  <text x="875" y="875" class="t">④ PA0、PB0/PB1/PB10 为当前候选引脚，最终以工程引脚表为准。</text>

  <text x="750" y="952" text-anchor="middle" class="s">概念原理图 V1｜用于方案讨论与软件接口设计，不可直接作为最终 PCB 打板依据</text>
</svg>